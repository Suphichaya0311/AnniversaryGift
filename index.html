<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To The One Who Makes My World Better</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading -->
    <div id="loading-screen">
        <div class="heart-loader">❤️</div>
        <p>Loading Memories...</p>
    </div>

    <!-- Music -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Button -->
    <button id="musicBtn">🎵</button>

    <!-- Password -->
    <section id="password-screen" class="screen active">

        <div class="password-box">

            <h1>💌</h1>

            <h2>To The One Who Makes My World Better</h2>

            <p>Fourwin ❤️</p>

            <p>Made with Love by Oil</p>

            <input
                type="password"
                id="passwordInput"
                placeholder="Enter Password"
            >

            <button onclick="checkPassword()">
                Open Gift 🎁
            </button>

        </div>

    </section>

    <!-- Gift Box -->
    <section id="gift-screen" class="screen">

        <div class="gift-container">

            <div id="giftBox">
                🎁
            </div>

            <p>Click the gift...</p>

        </div>

    </section>

    <!-- Welcome -->
    <section id="welcome-screen" class="screen">

        <div class="content">

            <h1>💌 Welcome Fourwin</h1>

            <p>
                Thank you for being part of my life.
            </p>

            <button class="next-btn" onclick="goToTimeline()">
                Start Our Story →
            </button>

        </div>

    </section>

    <!-- Timeline -->
    <section id="timeline-screen" class="screen">

        <div class="content">

            <h1>💕 Our Story</h1>

            <div class="timeline">

                <div class="event">
                    💬 6 December 2023
                    <br>
                    The day we met
                </div>

                <div class="event">
                    ❤️ 20 December 2023
                    <br>
                    The day we became us
                </div>

                <div class="event">
                    ✨ Today
                    <br>
                    Still together
                </div>

            </div>

            <button class="next-btn">
                Next →
            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
